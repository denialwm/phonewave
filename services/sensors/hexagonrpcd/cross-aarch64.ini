# Meson cross file for the phones (Arch Linux ARM), against the workspace
# sysroot. The libraries go to /usr/local/lib, found through the rpath.
[binaries]
c = 'aarch64-linux-gnu-gcc'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'

[built-in options]
c_args = ['--sysroot=/mnt/development/denial-os/cross/sysroot']
c_link_args = ['-Wl,-rpath,/usr/local/lib', '--sysroot=/mnt/development/denial-os/cross/sysroot', '-B/mnt/development/denial-os/cross/sysroot/lib', '-Wl,-rpath-link,/mnt/development/denial-os/cross/sysroot/usr/lib', '-Wl,-rpath-link,/mnt/development/denial-os/cross/sysroot/lib']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'armv9-a'
endian = 'little'

[package]
name = "steinerd"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Sensor service for Qualcomm phones: the Sensor Core over QRTR"
license = "MIT"

[dependencies]
async-channel = "2.5"
async-executor = "1"
async-io = "2.6"
async-signal = "0.2"
futures-lite = "2.6"
libc = "0.2"
zbus = "5.18"

[profile.release]
lto = "thin"
strip = true

[package]
name = "screen-record"
version = "0.1.0"
edition = "2024"
description = "Records the screen of a Denial phone or tablet"
publish = false

[dependencies]
gbm = { version = "0.18", default-features = false }
glow = "0.17"
khronos-egl = { version = "6", features = ["dynamic"] }
libc = "0.2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
lto = true
codegen-units = 1

# Stereo playback to the two TFA9873 amplifiers over the tertiary MI2S: the
# earpiece on top and the speaker on the bottom.
SectionVerb {
	EnableSequence [
		cset "name='TERTIARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		# The amplifiers have no speaker protection: -12 dB at the DSP
		# (8192 is 0 dB), which the topology also caps at -6 dB (4096).
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 2048"
	]

	DisableSequence [
		cset "name='TERTIARY_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

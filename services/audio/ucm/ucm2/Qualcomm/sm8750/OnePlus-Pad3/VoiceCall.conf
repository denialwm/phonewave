# Modem calls. The DSP carries the call between the modem and the hardware:
# PCM 13 is the kernel's policy endpoint (playback discarded, capture
# silent), there for the audio server to hold while the call runs. Enabling
# the Mic device asks the kernel to start the voice graphs once the HiFi
# PCMs are closed; disabling it stops them before the routes go.
# PlaybackVolume and CaptureSwitch are for callaudio, which sets them for
# call volume and microphone mute: the card uses software volume, which
# cannot reach speech that never passes through the audio server.
#
# The call graph (firmware/qcom/sm8750/OnePlus-Pad3-voice.bin, generated
# from the stock ACDB) plays the six AW882xx amplifiers on the secondary
# TDM port and reads one microphone decimator from the WCD TX port. Its
# stock levels number six, not the ten of the NX809J's graph.

SectionVerb {
    EnableSequence [
        cset "name='Voice Call UCM Switch' 0"
    ]
    DisableSequence [
        cset "name='Voice Call UCM Switch' 0"
    ]
    Value {
        TQ "Voice"
        Priority 1000
    }
}

SectionDevice."Speaker" {
    Comment "Speakers"
    # The stock voice-speaker paths are the plain speaker path: all six
    # amplifiers on the "Music" ACF profile. No DSP speaker protection runs
    # here either.
    EnableSequence [
        cset "name='aw_dev_0_prof' Music"
        cset "name='aw_dev_1_prof' Music"
        cset "name='aw_dev_2_prof' Music"
        cset "name='aw_dev_3_prof' Music"
        cset "name='aw_dev_5_prof' Music"
        cset "name='aw_dev_6_prof' Music"
        cset "name='aw_dev_0_switch' Enable"
        cset "name='aw_dev_1_switch' Enable"
        cset "name='aw_dev_2_switch' Enable"
        cset "name='aw_dev_3_switch' Enable"
        cset "name='aw_dev_5_switch' Enable"
        cset "name='aw_dev_6_switch' Enable"
    ]
    DisableSequence [
        cset "name='aw_dev_0_switch' Disable"
        cset "name='aw_dev_1_switch' Disable"
        cset "name='aw_dev_2_switch' Disable"
        cset "name='aw_dev_3_switch' Disable"
        cset "name='aw_dev_5_switch' Disable"
        cset "name='aw_dev_6_switch' Disable"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},13"
        PlaybackChannels 2
        PlaybackRate 48000
        # The stock's six levels, 0-5; 5 is loudest
        PlaybackVolume "name='Voice Call Volume'"
    }
}

SectionDevice."Mic" {
    Comment "Voice microphone (AMIC5)"
    # The voice graph reads decimator 0 of the WCD TX port - the stock
    # handset-mic's first mic, AMIC5 on ADC4. ADC_HIFI at zero gain, as
    # stock's handset path. The graph takes one mic channel, but the
    # kernel's policy PCM is two-channel S16: the second channel is the
    # graph's copy, not a second mic. The SWR input mapping is unconfirmed
    # (README unknowns, mic selection).
    EnableSequence [
        cset "name='ADC1 Switch' 0"
        cset "name='ADC1_MIXER Switch' 0"
        cset "name='ADC2 Switch' 0"
        cset "name='ADC2_MIXER Switch' 0"
        cset "name='ADC3 Switch' 0"
        cset "name='ADC3_MIXER Switch' 0"
        cset "name='ADC4 MUX' CH4_AMIC5"
        cset "name='ADC4_MIXER Switch' 1"
        cset "name='ADC4 Switch' 1"
        cset "name='TX3 MODE' ADC_HIFI"
        cset "name='ADC4 Volume' 0"
        cset "name='TX DEC0 MUX' SWR_MIC"
        cset "name='TX SMIC MUX0' ADC3"
        cset "name='TX_DEC0 Volume' 40"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
        cset "name='TX_AIF1 Capture Switch' 1"
        cset "name='Voice Call UCM Switch' 1"
    ]
    DisableSequence [
        # A failed STOP keeps the DSP's ports: stop before the routes go.
        cset "name='Voice Call UCM Switch' 0"
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX SMIC MUX0' ZERO"
        cset "name='ADC4 Switch' 0"
        cset "name='ADC4_MIXER Switch' 0"
    ]
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},13"
        CaptureChannels 2
        CaptureRate 48000
        CaptureSwitch "name='TX_AIF1 Capture Switch'"
    }
}

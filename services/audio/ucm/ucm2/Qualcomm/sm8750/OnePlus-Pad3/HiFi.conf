# OnePlus Pad 3 (erhai) HiFi use case.
#
# Card OnePlus-Pad3 on the sm8750 machine. Three FE PCM devices exist:
#   hw,0  capture     WCD9395 AMIC/DMIC, MultiMedia1 -> TX_CODEC_DMA_TX_3
#                     (stereo only: the q6apm capture FE takes 2..4
#                     channels, never 1)
#   hw,1  playback    6x AW88261 class-D PAs, MultiMedia2 -> SECONDARY_TDM_RX_0
#   hw,2  playback    WCD9395 HPH (USB-C headset), MultiMedia3 -> RX_CODEC_DMA_RX_0
#
# The speakers ride the stock speaker back end, TDM on the secondary
# interface: 8 slots of 32 bits at 48 kHz, each PA on the slot of its
# channel (0-3, 5, 6), data lane SD1 (gpio124). The stream is stereo: the
# ADSP's MFC puts left on the even slots and right on the odd ones, as the
# stock graph does (topology OnePlus-Pad3-tdm.m4), so the PCM's channel
# map is FL FR. Which speaker each PA drives is still unconfirmed
# (devices/erhai/audio/README.md, Q1).
#
# Control names (topology OnePlus-Pad3-tdm.m4, aw88261.c):
#   "SECONDARY_TDM_RX_0 Audio Mixer MultiMedia2"  routing
#   "stream1.vol_ctrl1 MultiMedia2 Playback Volu" 0..8192 (8192 = 0 dB)
#   "Speaker ChN PCM Playback Volume"             0..360, N = 0,1,2,3,5,6
#   "Speaker ChN Profile Set"                     {Music}
#   "RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia3"   routing
#   "stream2.vol_ctrl2 MultiMedia3 Playback Volu" 0..8192 (8192 = 0 dB)
#
# The headset is USB-C analog only (no 3.5 mm jack). The machine's
# "Headset Jack" reports it through the "Headphone Jack" and "Mic Jack"
# controls once the WCD939x USBSS has switched the connector to the
# audio accessory and the MBHC has detected the plug.

# The capture PCM is stereo only. A single mic feeds both decimators of
# the stream (DEC0 and DEC1), as on the Pad 4 and the Nubia, and is
# offered as a mono source made of channel 0 (alsa-ucm-conf's split PCM:
# PipeWire splits it itself, other ALSA clients get a dsnoop). The
# endfire pair (Mic2) is the same PCM split into its two channels.
Include.pcm_split.File "/common/pcm/split.conf"

Macro [
    {
        SplitPCM {
            Name "pad3_mics"
            Direction Capture
            Channels 2
            HWChannels 2
            HWChannelPos0 FL
            HWChannelPos1 FR
        }
    }
]

SectionVerb {
    EnableSequence [
        cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia2' 1"
        cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia3' 1"
        cset "name='MultiMedia1 Mixer TX_CODEC_DMA_TX_3' 1"
    ]
    DisableSequence [
        cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia2' 0"
        cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia3' 0"
        cset "name='MultiMedia1 Mixer TX_CODEC_DMA_TX_3' 0"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Speakers (6x AW88261 on SECONDARY_TDM_RX_0)"
    # Stream gain at unity: PipeWire applies the software volume on top.
    # 350 on the 0..360 PA scale is the ACF Music profile's own level
    # (SYSCTRL2 0x0014, -2.5 dB), stock's, and the most the PAs should
    # get. At the -20 dB bring-up level (280) the stream had to run near
    # full scale to be heard and distorted.
    EnableSequence [
        cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8192"
        cset "name='Speaker Ch0 Profile Set' Music"
        cset "name='Speaker Ch1 Profile Set' Music"
        cset "name='Speaker Ch2 Profile Set' Music"
        cset "name='Speaker Ch3 Profile Set' Music"
        cset "name='Speaker Ch5 Profile Set' Music"
        cset "name='Speaker Ch6 Profile Set' Music"
        cset "name='Speaker Ch0 PCM Playback Volume' 350"
        cset "name='Speaker Ch1 PCM Playback Volume' 350"
        cset "name='Speaker Ch2 PCM Playback Volume' 350"
        cset "name='Speaker Ch3 PCM Playback Volume' 350"
        cset "name='Speaker Ch5 PCM Playback Volume' 350"
        cset "name='Speaker Ch6 PCM Playback Volume' 350"
    ]
    DisableSequence [
        cset "name='Speaker Ch0 PCM Playback Volume' 0"
        cset "name='Speaker Ch1 PCM Playback Volume' 0"
        cset "name='Speaker Ch2 PCM Playback Volume' 0"
        cset "name='Speaker Ch3 PCM Playback Volume' 0"
        cset "name='Speaker Ch5 PCM Playback Volume' 0"
        cset "name='Speaker Ch6 PCM Playback Volume' 0"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},1"
        PlaybackChannels 2
    }
}

SectionDevice."Headphones" {
    Comment "USB-C headset"
    # The stock "headphones" path (odm/etc/mixer_paths.xml) in the in-tree
    # control names: vendor "RX_HPH_PWR_MODE" -> "RX_HPH PWR Mode",
    # "HPHL/HPHR Compander" -> "HPHL_COMP/HPHR_COMP Switch". The in-tree
    # driver also needs its SoundWire ports switched on (HPHL, HPHR, CLSH).
    # RX digital volume 82 is stock's (-2 dB; the same 0..124 scale in both
    # kernels). Stock's "HPHL/HPHR Volume" 16 is the PA gain register,
    # which the in-tree control does not drive and which the compander
    # overrides while it runs, so it is left alone; the stock XTALK
    # switches have no in-tree control. PipeWire does the software volume.
    EnableSequence [
        cset "name='stream2.vol_ctrl2 MultiMedia3 Playback Volu' 8192"
        cset "name='RX_HPH PWR Mode' LOHIFI"
        cset "name='RX HPH Mode' CLS_H_HIFI"
        cset "name='RX_MACRO RX0 MUX' AIF1_PB"
        cset "name='RX_MACRO RX1 MUX' AIF1_PB"
        cset "name='RX INT0_1 MIX1 INP0' RX0"
        cset "name='RX INT1_1 MIX1 INP0' RX1"
        cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
        cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
        cset "name='RX_RX0 Digital Volume' 82"
        cset "name='RX_RX1 Digital Volume' 82"
        cset "name='HPHL_COMP Switch' 1"
        cset "name='HPHR_COMP Switch' 1"
        cset "name='HPHL Switch' 1"
        cset "name='HPHR Switch' 1"
        cset "name='CLSH Switch' 1"
        cset "name='HPHL_RDAC Switch' 1"
        cset "name='HPHR_RDAC Switch' 1"
    ]
    DisableSequence [
        cset "name='HPHL_RDAC Switch' 0"
        cset "name='HPHR_RDAC Switch' 0"
        cset "name='HPHL Switch' 0"
        cset "name='HPHR Switch' 0"
        cset "name='CLSH Switch' 0"
        cset "name='HPHL_COMP Switch' 0"
        cset "name='HPHR_COMP Switch' 0"
        cset "name='RX INT0_1 MIX1 INP0' ZERO"
        cset "name='RX INT1_1 MIX1 INP0' ZERO"
        cset "name='RX_MACRO RX0 MUX' ZERO"
        cset "name='RX_MACRO RX1 MUX' ZERO"
    ]
    Value {
        PlaybackPriority 200
        PlaybackPCM "hw:${CardId},2"
        PlaybackChannels 2
        JackControl "Headphone Jack"
        JackHWMute "Speaker"
    }
}

SectionDevice."Headset" {
    Comment "USB-C headset microphone (AMIC2)"
    ConflictingDevice [
        "Mic1"
        "Mic2"
        "Mic3"
    ]
    # The stock "headset-mic" path: amic2 (AMIC2 -> ADC2 -> decimator 0,
    # ADC_LP, the MBHC channel mapped), ADC2 Volume 10, decimator 84
    # (0 dB, the same scale in-tree). ADC2 rides the tx-macro's SWR input
    # "ADC1" (ADC1..ADC4 = "ADC0".."ADC3", as Mic1's ADC4 on "ADC3").
    EnableSequence [
        cset "name='ADC1 Switch' 0"
        cset "name='ADC1_MIXER Switch' 0"
        cset "name='ADC3 Switch' 0"
        cset "name='ADC3_MIXER Switch' 0"
        cset "name='ADC4 Switch' 0"
        cset "name='ADC4_MIXER Switch' 0"
        cset "name='ADC2 MUX' CH2_AMIC2"
        cset "name='ADC2_MIXER Switch' 1"
        cset "name='ADC2 Switch' 1"
        cset "name='MBHC Switch' 1"
        cset "name='TX1 MODE' ADC_LP"
        cset "name='ADC2 Volume' 10"
        cset "name='TX DEC0 MUX' SWR_MIC"
        cset "name='TX DEC1 MUX' SWR_MIC"
        cset "name='TX SMIC MUX0' SWR_MIC1"
        cset "name='TX SMIC MUX1' SWR_MIC1"
        cset "name='TX_DEC0 Volume' 84"
        cset "name='TX_DEC1 Volume' 84"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
        cset "name='TX_AIF1_CAP Mixer DEC1' 1"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX_AIF1_CAP Mixer DEC1' 0"
        cset "name='TX SMIC MUX0' ZERO"
        cset "name='TX SMIC MUX1' ZERO"
        cset "name='MBHC Switch' 0"
        cset "name='ADC2 Switch' 0"
        cset "name='ADC2_MIXER Switch' 0"
    ]
    Value {
        CapturePriority 300
        JackControl "Mic Jack"
        JackHWMute "Mic1 Mic2 Mic3"
    }
    Macro.pcm_split.SplitPCMDevice {
        Name "pad3_mics"
        Direction Capture
        HWChannels 2
        Channels 1
        Channel0 0
        ChannelPos0 MONO
    }
}

SectionDevice."Mic1" {
    Comment "Main microphone (AMIC5)"
    ConflictingDevice [
        "Mic2"
        "Mic3"
        "Headset"
    ]
    # Stock's default microphone: the stock resourcemanager's default
    # IN device is the "handset-mic" path, whose first decimator - the one
    # a 1-channel capture actually reads - is AMIC5 on ADC4. Stock feeds a
    # second mic (AMIC1 -> decimator 1) into the same port; here decimator
    # 1 takes AMIC5 too (the PCM is stereo only) and the source is
    # channel 0. The stock path is ADC_HIFI at zero ADC gain,
    # decimator at 0 dB (84: the in-tree control has the vendor's 0..124
    # scale, -84 dB + 1 dB per step).
    # Which SWR input carries ADC4: the erhai DT routes "ADC4_OUTPUT" to
    # "TX SWR_INPUT3", and the active LPASS v9_2 tx-macro names that mux
    # item "SWR_MIC3" (the old "ADC3" item name does not exist in the v9_2
    # enum - cset fails silently and the codec TX DAPM chain never powers).
    EnableSequence [
        cset "name='ADC1 Switch' 0"
        cset "name='ADC1_MIXER Switch' 0"
        cset "name='ADC2 Switch' 0"
        cset "name='ADC2_MIXER Switch' 0"
        cset "name='ADC3 Switch' 0"
        cset "name='ADC3_MIXER Switch' 0"
        cset "name='ADC4 MUX' CH4_AMIC5"
        cset "name='ADC4_MIXER Switch' 1"
        cset "name='ADC4 Switch' 1"
        cset "name='TX3 MODE' ADC_HIFI"
        cset "name='ADC4 Volume' 0"
        cset "name='TX DEC0 MUX' SWR_MIC"
        cset "name='TX DEC1 MUX' SWR_MIC"
        cset "name='TX SMIC MUX0' SWR_MIC3"
        cset "name='TX SMIC MUX1' SWR_MIC3"
        cset "name='TX_DEC0 Volume' 84"
        cset "name='TX_DEC1 Volume' 84"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
        cset "name='TX_AIF1_CAP Mixer DEC1' 1"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX_AIF1_CAP Mixer DEC1' 0"
        cset "name='TX SMIC MUX0' ZERO"
        cset "name='TX SMIC MUX1' ZERO"
        cset "name='ADC4 Switch' 0"
        cset "name='ADC4_MIXER Switch' 0"
    ]
    Value {
        CapturePriority 200
    }
    Macro.pcm_split.SplitPCMDevice {
        Name "pad3_mics"
        Direction Capture
        HWChannels 2
        Channels 1
        Channel0 0
        ChannelPos0 MONO
    }
}

SectionDevice."Mic2" {
    Comment "Digital mic endfire pair (DMIC2 + DMIC3)"
    ConflictingDevice [
        "Mic1"
        "Mic3"
        "Headset"
    ]
    # Stock's "dual-mic" configuration: the endfire pair. Stock's 1-channel
    # endfire output was its ACDB graph's work; here the pair is the raw
    # stereo capture, so the stream is 2 channels. Which physical mics
    # DMIC2/DMIC3 are is unconfirmed (README unknowns, mic selection).
    EnableSequence [
        cset "name='TX DEC1 MUX' MSM_DMIC"
        cset "name='TX DMIC MUX1' DMIC2"
        cset "name='TX DEC2 MUX' MSM_DMIC"
        cset "name='TX DMIC MUX2' DMIC3"
        cset "name='TX_DEC1 Volume' 84"
        cset "name='TX_DEC2 Volume' 84"
        cset "name='TX_AIF1_CAP Mixer DEC1' 1"
        cset "name='TX_AIF1_CAP Mixer DEC2' 1"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC1' 0"
        cset "name='TX_AIF1_CAP Mixer DEC2' 0"
        cset "name='TX DMIC MUX1' DMIC0"
        cset "name='TX DMIC MUX2' DMIC0"
    ]
    Value {
        CapturePriority 100
    }
    Macro.pcm_split.SplitPCMDevice {
        Name "pad3_mics"
        Direction Capture
        HWChannels 2
        Channels 2
        Channel0 0
        Channel1 1
        ChannelPos0 FL
        ChannelPos1 FR
    }
}

SectionDevice."Mic3" {
    Comment "First digital mic (DMIC0)"
    ConflictingDevice [
        "Mic1"
        "Mic2"
        "Headset"
    ]
    # Stock's "dmic1" path, 1 channel as the stock record backend: both
    # decimators take DMIC0 (the PCM is stereo only), the source is
    # channel 0.
    EnableSequence [
        cset "name='TX DEC0 MUX' MSM_DMIC"
        cset "name='TX DMIC MUX0' DMIC0"
        cset "name='TX DEC1 MUX' MSM_DMIC"
        cset "name='TX DMIC MUX1' DMIC0"
        cset "name='TX_DEC0 Volume' 84"
        cset "name='TX_DEC1 Volume' 84"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
        cset "name='TX_AIF1_CAP Mixer DEC1' 1"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX_AIF1_CAP Mixer DEC1' 0"
        cset "name='TX DMIC MUX0' DMIC0"
        cset "name='TX DMIC MUX1' DMIC0"
    ]
    Value {
        CapturePriority 50
    }
    Macro.pcm_split.SplitPCMDevice {
        Name "pad3_mics"
        Direction Capture
        HWChannels 2
        Channels 1
        Channel0 0
        ChannelPos0 MONO
    }
}

# OnePlus Pad 3 (erhai) HiFi use case.
#
# Card OnePlus-Pad3 on the sm8750 machine. Two FE PCM devices exist:
#   hw,0  capture     WCD9395 AMIC/DMIC, MultiMedia1 -> TX_CODEC_DMA_TX_3
#   hw,1  playback    6x AW88261 class-D PAs, MultiMedia2 -> SECONDARY_TDM_RX_0
#
# The speakers ride the stock speaker back end, TDM on the secondary
# interface: 8 slots of 32 bits at 48 kHz, each PA on the slot of its
# channel (0-3, 5, 6), data lane SD1 (gpio124). The stream is stereo: the
# ADSP's MFC puts left on the even slots and right on the odd ones, as the
# stock graph does (topology OnePlus-Pad3-tdm.m4), so the PCM's channel
# map is FL FR. Which speaker each PA drives is still unconfirmed
# (devices/erhai/audio/README.md, Q1).
#
# Control names (topology OnePlus-Pad3-tdm.m4, aw88261.c):
#   "SECONDARY_TDM_RX_0 Audio Mixer MultiMedia2"  routing
#   "stream1.vol_ctrl1 MultiMedia2 Playback Volu" 0..8192 (8192 = 0 dB)
#   "Speaker ChN PCM Playback Volume"             0..360, N = 0,1,2,3,5,6
#   "Speaker ChN Profile Set"                     {Music}

SectionVerb {
    EnableSequence [
        cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia2' 1"
        cset "name='MultiMedia1 Mixer TX_CODEC_DMA_TX_3' 1"
    ]
    DisableSequence [
        cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia2' 0"
        cset "name='MultiMedia1 Mixer TX_CODEC_DMA_TX_3' 0"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Speakers (6x AW88261 on SECONDARY_TDM_RX_0)"
    # Stream gain at unity: PipeWire applies the software volume on top.
    # 350 on the 0..360 PA scale is the ACF Music profile's own level
    # (SYSCTRL2 0x0014, -2.5 dB), stock's, and the most the PAs should
    # get. At the -20 dB bring-up level (280) the stream had to run near
    # full scale to be heard and distorted.
    EnableSequence [
        cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8192"
        cset "name='Speaker Ch0 Profile Set' Music"
        cset "name='Speaker Ch1 Profile Set' Music"
        cset "name='Speaker Ch2 Profile Set' Music"
        cset "name='Speaker Ch3 Profile Set' Music"
        cset "name='Speaker Ch5 Profile Set' Music"
        cset "name='Speaker Ch6 Profile Set' Music"
        cset "name='Speaker Ch0 PCM Playback Volume' 350"
        cset "name='Speaker Ch1 PCM Playback Volume' 350"
        cset "name='Speaker Ch2 PCM Playback Volume' 350"
        cset "name='Speaker Ch3 PCM Playback Volume' 350"
        cset "name='Speaker Ch5 PCM Playback Volume' 350"
        cset "name='Speaker Ch6 PCM Playback Volume' 350"
    ]
    DisableSequence [
        cset "name='Speaker Ch0 PCM Playback Volume' 0"
        cset "name='Speaker Ch1 PCM Playback Volume' 0"
        cset "name='Speaker Ch2 PCM Playback Volume' 0"
        cset "name='Speaker Ch3 PCM Playback Volume' 0"
        cset "name='Speaker Ch5 PCM Playback Volume' 0"
        cset "name='Speaker Ch6 PCM Playback Volume' 0"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},1"
        PlaybackChannels 2
    }
}

SectionDevice."Mic1" {
    Comment "Main microphone (AMIC5)"
    ConflictingDevice [
        "Mic2"
        "Mic3"
    ]
    # Stock's default microphone: the stock resourcemanager's default
    # IN device is the "handset-mic" path, whose first decimator - the one
    # a 1-channel capture actually reads - is AMIC5 on ADC4. Stock feeds a
    # second mic (AMIC1 -> decimator 1) into the same port; it stays out of
    # the stream here. The stock path is ADC_HIFI at zero ADC gain,
    # decimator at 0 dB (84 on the vendor scale, 40 in-tree).
    # Which SWR input carries ADC4 is the in-tree tx-macro's "ADC3" (its
    # four ADC inputs map to ADC1..ADC4); the SWR port/channel table comes
    # from the DT - confirm on first boot (README unknowns, mic selection).
    EnableSequence [
        cset "name='ADC1 Switch' 0"
        cset "name='ADC1_MIXER Switch' 0"
        cset "name='ADC2 Switch' 0"
        cset "name='ADC2_MIXER Switch' 0"
        cset "name='ADC3 Switch' 0"
        cset "name='ADC3_MIXER Switch' 0"
        cset "name='ADC4 MUX' CH4_AMIC5"
        cset "name='ADC4_MIXER Switch' 1"
        cset "name='ADC4 Switch' 1"
        cset "name='TX3 MODE' ADC_HIFI"
        cset "name='ADC4 Volume' 0"
        cset "name='TX DEC0 MUX' SWR_MIC"
        cset "name='TX SMIC MUX0' ADC3"
        cset "name='TX_DEC0 Volume' 40"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX SMIC MUX0' ZERO"
        cset "name='ADC4 Switch' 0"
        cset "name='ADC4_MIXER Switch' 0"
    ]
    Value {
        CapturePriority 200
        CapturePCM "hw:${CardId},0"
        CaptureChannels 1
    }
}

SectionDevice."Mic2" {
    Comment "Digital mic endfire pair (DMIC2 + DMIC3)"
    ConflictingDevice [
        "Mic1"
        "Mic3"
    ]
    # Stock's "dual-mic" configuration: the endfire pair. Stock's 1-channel
    # endfire output was its ACDB graph's work; here the pair is the raw
    # stereo capture, so the stream is 2 channels. Which physical mics
    # DMIC2/DMIC3 are is unconfirmed (README unknowns, mic selection).
    EnableSequence [
        cset "name='TX DEC1 MUX' MSM_DMIC"
        cset "name='TX DMIC MUX1' DMIC2"
        cset "name='TX DEC2 MUX' MSM_DMIC"
        cset "name='TX DMIC MUX2' DMIC3"
        cset "name='TX_DEC1 Volume' 40"
        cset "name='TX_DEC2 Volume' 40"
        cset "name='TX_AIF1_CAP Mixer DEC1' 1"
        cset "name='TX_AIF1_CAP Mixer DEC2' 1"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC1' 0"
        cset "name='TX_AIF1_CAP Mixer DEC2' 0"
        cset "name='TX DMIC MUX1' DMIC0"
        cset "name='TX DMIC MUX2' DMIC0"
    ]
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},0"
        CaptureChannels 2
    }
}

SectionDevice."Mic3" {
    Comment "First digital mic (DMIC0)"
    ConflictingDevice [
        "Mic1"
        "Mic2"
    ]
    # Stock's "dmic1" path. 1 channel, as the stock record backend.
    EnableSequence [
        cset "name='TX DEC0 MUX' MSM_DMIC"
        cset "name='TX DMIC MUX0' DMIC0"
        cset "name='TX_DEC0 Volume' 40"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX DMIC MUX0' DMIC0"
    ]
    Value {
        CapturePriority 50
        CapturePCM "hw:${CardId},0"
        CaptureChannels 1
    }
}

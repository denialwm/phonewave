# OnePlus Pad 3 (erhai) HiFi use case.
#
# Card OnePlus-Pad3 on the sm8750 machine. FE PCM device numbers follow the
# topology's MultiMedia order (the planned m4 routes MM1 to the speaker TDM
# port, MM2 to the WCD headphone port, MM3 to the WCD capture port, MM4 to
# the VA capture port):
#   hw,0  speaker     6x AW882xx on SECONDARY_TDM_RX, 8-slot 32-bit TDM
#   hw,1  headphones  WCD9395 HPH, RX_CODEC_DMA_RX_0
#   hw,2  mics        WCD9395 AMIC/DMIC, TX_CODEC_DMA_TX_3
#   hw,3  VA capture  VA_CODEC_DMA_TX_0 (no device; reserved)
#   hw,13 voice       the kernel's voice policy PCM (VoiceCall.conf)
# hw,0/1/2/3 are planned, not yet measured: confirm on first boot, per
# devices/erhai/audio/README.md. All cset names below are the in-tree
# driver's (wcd939x.c / lpass-rx-macro.c / lpass-tx-macro.c / aw882xx.c);
# the stock values are the pinned stock tuning's (erhai/reference/stock-audio/ in the vault).

SectionVerb {
    EnableSequence [
        # The topology already routes these streams; the csets power the
        # backends before the first stream (the NX809J pattern). The m4
        # names the speaker backend SECONDARY_TDM_RX_0, whose mixer
        # kcontrol is "SECONDARY_TDM_RX Audio Mixer" (see the topology
        # README's kcontrol list).
        cset "name='SECONDARY_TDM_RX Audio Mixer MultiMedia1' 1"
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
    ]
    DisableSequence [
        cset "name='SECONDARY_TDM_RX Audio Mixer MultiMedia1' 0"
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Speakers"
    # The six PAs' sound-channel values (DT): aw_dev_0 = i2c9 0x34,
    # aw_dev_1 = i2c4 0x35, aw_dev_2 = i2c9 0x35, aw_dev_3 = i2c4 0x34,
    # aw_dev_5 = i2c4 0x36, aw_dev_6 = i2c9 0x36. The DT sound-channel is
    # each PA's slot on the TDM stream; which physical speaker each one
    # drives is still unconfirmed (README unknowns, Q1/Q8).
    EnableSequence [
        # The ADSP's stream gain stays at unity; PipeWire sets the volume
        # in software. The control is the topology's vol_ctrl pga
        # (topology README's kcontrol list), capped at 8192 = 0 dB.
        cset "name='MultiMedia1 Playback Volume' 8192"
        # The stock speaker path: every PA on the "Music" ACF profile,
        # enabled. Stock never sets aw_dev_N_volume - the ACF profiles
        # (firmware/qcom/sm8750/aw882xx_acf.bin) carry the per-band gains,
        # and the SPK_* audiox_param level sets are the DSP stream gains.
        cset "name='aw_dev_0_prof' Music"
        cset "name='aw_dev_1_prof' Music"
        cset "name='aw_dev_2_prof' Music"
        cset "name='aw_dev_3_prof' Music"
        cset "name='aw_dev_5_prof' Music"
        cset "name='aw_dev_6_prof' Music"
        cset "name='aw_dev_0_switch' Enable"
        cset "name='aw_dev_1_switch' Enable"
        cset "name='aw_dev_2_switch' Enable"
        cset "name='aw_dev_3_switch' Enable"
        cset "name='aw_dev_5_switch' Enable"
        cset "name='aw_dev_6_switch' Enable"
    ]
    DisableSequence [
        cset "name='aw_dev_0_switch' Disable"
        cset "name='aw_dev_1_switch' Disable"
        cset "name='aw_dev_2_switch' Disable"
        cset "name='aw_dev_3_switch' Disable"
        cset "name='aw_dev_5_switch' Disable"
        cset "name='aw_dev_6_switch' Disable"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
    }
}

SectionDevice."Headphones" {
    Comment "Headphones (USB-C analog jack)"
    # The stock "headphones" path, translated to the in-tree driver's
    # control names (vendor "RX_HPH_PWR_MODE" -> "RX_HPH PWR Mode",
    # "HPHL Compander" -> "HPHL_COMP Switch"). Stock's RX digital volume 82
    # is -1 dB on its 0..84 scale; the in-tree scale is -84..40 with 40 =
    # 0 dB, so 39. HPHL/HPHR Volume 16 (of 20) is stock's fixed analog
    # level; PipeWire does the software volume.
    # The jack is a USB-C analog connector; whether the in-tree wcd939x
    # MBHC detects the plug is unconfirmed (README unknowns, Q3) - the
    # MBHC switch also starts the detection FSM.
    EnableSequence [
        cset "name='MultiMedia2 Playback Volume' 8192"
        cset "name='MBHC Switch' 1"
        cset "name='RX_HPH PWR Mode' LOHIFI"
        cset "name='RX HPH Mode' CLS_H_HIFI"
        cset "name='RX_MACRO RX0 MUX' AIF1_PB"
        cset "name='RX_MACRO RX1 MUX' AIF1_PB"
        cset "name='RX INT0_1 MIX1 INP0' RX0"
        cset "name='RX INT1_1 MIX1 INP0' RX1"
        cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
        cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
        cset "name='HPHL_COMP Switch' 1"
        cset "name='HPHR_COMP Switch' 1"
        cset "name='HPHL_RDAC Switch' 1"
        cset "name='HPHR_RDAC Switch' 1"
        cset "name='RX_RX0 Digital Volume' 39"
        cset "name='RX_RX1 Digital Volume' 39"
        cset "name='HPHL Volume' 16"
        cset "name='HPHR Volume' 16"
    ]
    DisableSequence [
        cset "name='HPHL_RDAC Switch' 0"
        cset "name='HPHR_RDAC Switch' 0"
        cset "name='RX_MACRO RX0 MUX' ZERO"
        cset "name='RX_MACRO RX1 MUX' ZERO"
        cset "name='RX INT0_1 MIX1 INP0' ZERO"
        cset "name='RX INT1_1 MIX1 INP0' ZERO"
        cset "name='HPHL_COMP Switch' 0"
        cset "name='HPHR_COMP Switch' 0"
    ]
    Value {
        PlaybackPriority 50
        PlaybackPCM "hw:${CardId},1"
        PlaybackChannels 2
    }
}

SectionDevice."Mic1" {
    Comment "Main microphone (AMIC5)"
    ConflictingDevice [
        "Mic2"
        "Mic3"
    ]
    # Stock's default microphone: the stock resourcemanager's default
    # IN device is the "handset-mic" path, whose first decimator - the one
    # a 1-channel capture actually reads - is AMIC5 on ADC4. Stock feeds a
    # second mic (AMIC1 -> decimator 1) into the same port; it stays out of
    # the stream here. The stock path is ADC_HIFI at zero ADC gain,
    # decimator at 0 dB (84 on the vendor scale, 40 in-tree).
    # Which SWR input carries ADC4 is the in-tree tx-macro's "ADC3" (its
    # four ADC inputs map to ADC1..ADC4); the SWR port/channel table comes
    # from the DT - confirm on first boot (README unknowns, mic selection).
    EnableSequence [
        cset "name='ADC1 Switch' 0"
        cset "name='ADC1_MIXER Switch' 0"
        cset "name='ADC2 Switch' 0"
        cset "name='ADC2_MIXER Switch' 0"
        cset "name='ADC3 Switch' 0"
        cset "name='ADC3_MIXER Switch' 0"
        cset "name='ADC4 MUX' CH4_AMIC5"
        cset "name='ADC4_MIXER Switch' 1"
        cset "name='ADC4 Switch' 1"
        cset "name='TX3 MODE' ADC_HIFI"
        cset "name='ADC4 Volume' 0"
        cset "name='TX DEC0 MUX' SWR_MIC"
        cset "name='TX SMIC MUX0' ADC3"
        cset "name='TX_DEC0 Volume' 40"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX SMIC MUX0' ZERO"
        cset "name='ADC4 Switch' 0"
        cset "name='ADC4_MIXER Switch' 0"
    ]
    Value {
        CapturePriority 200
        CapturePCM "hw:${CardId},2"
        CaptureChannels 1
    }
}

SectionDevice."Mic2" {
    Comment "Digital mic endfire pair (DMIC2 + DMIC3)"
    ConflictingDevice [
        "Mic1"
        "Mic3"
    ]
    # Stock's "dual-mic" configuration: the endfire pair. Stock's 1-channel
    # endfire output was its ACDB graph's work; here the pair is the raw
    # stereo capture, so the stream is 2 channels. Which physical mics
    # DMIC2/DMIC3 are is unconfirmed (README unknowns, mic selection).
    EnableSequence [
        cset "name='TX DEC1 MUX' MSM_DMIC"
        cset "name='TX DMIC MUX1' DMIC2"
        cset "name='TX DEC2 MUX' MSM_DMIC"
        cset "name='TX DMIC MUX2' DMIC3"
        cset "name='TX_DEC1 Volume' 40"
        cset "name='TX_DEC2 Volume' 40"
        cset "name='TX_AIF1_CAP Mixer DEC1' 1"
        cset "name='TX_AIF1_CAP Mixer DEC2' 1"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC1' 0"
        cset "name='TX_AIF1_CAP Mixer DEC2' 0"
        cset "name='TX DMIC MUX1' DMIC0"
        cset "name='TX DMIC MUX2' DMIC0"
    ]
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},2"
        CaptureChannels 2
    }
}

SectionDevice."Mic3" {
    Comment "First digital mic (DMIC0)"
    ConflictingDevice [
        "Mic1"
        "Mic2"
    ]
    # Stock's "dmic1" path. 1 channel, as the stock record backend.
    EnableSequence [
        cset "name='TX DEC0 MUX' MSM_DMIC"
        cset "name='TX DMIC MUX0' DMIC0"
        cset "name='TX_DEC0 Volume' 40"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX DMIC MUX0' DMIC0"
    ]
    Value {
        CapturePriority 50
        CapturePCM "hw:${CardId},2"
        CaptureChannels 1
    }
}

SectionVerb {
	EnableSequence [
		cset "name='QUIN_TDM_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia1 Mixer PRIMARY_TDM_TX_0' 1"
	]
	DisableSequence [
		cset "name='QUIN_TDM_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia1 Mixer PRIMARY_TDM_TX_0' 0"
	]
	Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
	Comment "TAS2562 pair on QUIN TDM RX"
	EnableSequence [
		cset "name='ASI1 Sel' Left"
		cset "name='Amp Gain Volume' 16"
		cset "name='Digital Volume Control' 90"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "RT5514P on PRIMARY TDM TX, mono at 32 kHz"
	EnableSequence [
		cset "name='Stereo1 DMIC Mux' DMIC1"
		cset "name='Sto1 ADC MIXL DMIC Switch' 1"
		cset "name='ADC1 Capture Volume' 23"
	]
	DisableSequence [
		cset "name='Sto1 ADC MIXL DMIC Switch' 0"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
	}
}

# Modem calls. The DSP carries the call between the modem and the hardware:
# PCM 13 is the kernel's policy endpoint (playback discarded, capture silent),
# there for the audio server to hold while the call runs. Enabling the Mic
# device asks the kernel to start the voice graphs once the HiFi PCMs are
# closed; disabling it stops them before the routes go.
# PlaybackVolume and CaptureSwitch are for callaudio, which sets them for
# call volume and microphone mute: the card uses software volume, which
# cannot reach speech that never passes through the audio server.

SectionVerb {
	EnableSequence [
		cset "name='Voice Call UCM Switch' 0"
	]
	DisableSequence [
		cset "name='Voice Call UCM Switch' 0"
	]
	Value {
		TQ "Voice"
		Priority 1000
	}
}

SectionDevice."Speaker" {
	Comment "Top and bottom speakers"
	# The voice profile plays both TFA9873 amplifiers on Secondary MI2S.
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},13"
		PlaybackChannels 2
		PlaybackRate 48000
		# 0-5, the stock audio HAL's six levels; 5 is loudest
		PlaybackVolume "name='Voice Call Volume'"
	}
}

SectionDevice."Mic" {
	Comment "Handset microphone (AMIC5)"
	# The voice profile reads one channel from decimator 0, as the stock
	# handset path. ADC1/2 and ADC3/4 share a SoundWire master port.
	EnableSequence [
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='HDR34 MUX' NO_HDR34"
		cset "name='ADC4 MUX' INP5"
		cset "name='ADC4 Switch' 1"
		cset "name='TX3 MODE' ADC_NORMAL"
		cset "name='ADC4 Volume' 6"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX SMIC MUX1' SWR_MIC1"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_DEC1 Volume' 84"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_AIF1 Capture Switch' 1"
		cset "name='Voice Call UCM Switch' 1"
	]
	DisableSequence [
		# A failed STOP keeps the DSP's ports: stop before the routes go.
		cset "name='Voice Call UCM Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC4 Switch' 0"
		cset "name='ADC4_MIXER Switch' 0"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},13"
		CaptureChannels 2
		CaptureRate 48000
		CaptureSwitch "name='TX_AIF1 Capture Switch'"
	}
}

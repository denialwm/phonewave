SectionVerb {
	EnableSequence [
		cset "name='QUATERNARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
	]
	DisableSequence [
		cset "name='QUATERNARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 0"
	]
	Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
	Comment "Top and bottom speakers"
	EnableSequence [
		# Keep the DSP's default gain. Its topology dB metadata is invalid;
		# PipeWire must use software volume, never the 65535-step dB scale.
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# The VA capture is stereo only: both decimators take the same microphone.
SectionDevice."Mic1" {
	Comment "Bottom microphone (DMIC1)"
	ConflictingDevice [
		"Mic2"
	]
	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC1"
		cset "name='VA DMIC MUX1' DMIC1"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
	]
	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA DMIC MUX1' ZERO"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}

SectionDevice."Mic2" {
	Comment "Top microphone (DMIC3)"
	ConflictingDevice [
		"Mic1"
	]
	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC3"
		cset "name='VA DMIC MUX1' DMIC3"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
	]
	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA DMIC MUX1' ZERO"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}

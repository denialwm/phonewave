SectionVerb {
    EnableSequence [
        cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
    ]
    DisableSequence [
        cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Tablet speakers"
    EnableSequence [
        # Keep the DSP's default gain. Its topology dB metadata is invalid;
        # PipeWire must use software volume, never the 65535-step dB scale.
        cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
    }
}

Syntax 7

# OnePlus Pad 3 (erhai), card OnePlus-Pad3. The sm8750 directory follows
# the machine driver's name (sound/soc/qcom/sc8280xp.c, driver_name
# "sm8750").
#
# HiFi only, as the OnePlus Pad 4. The Pad 3 has no modem, so it has no
# modem calls: a call is a VoIP app's stream, which plays and records
# through the HiFi devices like any other. A "Voice Call" verb would also
# need the kernel's voice policy PCM, which the card does not have (no
# voice profile ships), and stock amplifier controls the in-tree driver
# does not name: PipeWire could only fail to set it.
#
# Bluetooth audio is not on this card. Bluetooth headphones and speakers
# (A2DP) and headsets (HFP, SCO over HCI) are PipeWire's bluez5 devices,
# carried over the controller's HCI UART; the stock LPASS Bluetooth
# SoundWire offload path is not used.

SectionUseCase."HiFi" {
    File "/Qualcomm/sm8750/OnePlus-Pad3/HiFi.conf"
    Comment "OnePlus Pad 3 speakers, headphones, mics"
}

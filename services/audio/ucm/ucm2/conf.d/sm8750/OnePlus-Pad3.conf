Syntax 4

# OnePlus Pad 3 (erhai), card OnePlus-Pad3. The sm8750 directory follows
# the machine driver's name (sound/soc/qcom/sc8280xp.c, driver_name
# "sm8750").
#
# Bluetooth is not profiled: the stock DT enables the LPASS Bluetooth
# SoundWire link, but the in-tree kernel has no lpass-bt-swr driver yet, so
# the card exposes no A2DP/SCO devices (devices/erhai/audio/README.md,
# unknowns Q4).

SectionUseCase."HiFi" {
    File "/Qualcomm/sm8750/OnePlus-Pad3/HiFi.conf"
    Comment "OnePlus Pad 3 speakers, headphones, mics"
}

SectionUseCase."Voice Call" {
    File "/Qualcomm/sm8750/OnePlus-Pad3/VoiceCall.conf"
    Comment "Modem calls"
}

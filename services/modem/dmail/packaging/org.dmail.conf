<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.dmail"/>
    <allow send_destination="org.dmail"/>
  </policy>
  <!-- Messages and the SIM PIN: the phone's user only, through the group. -->
  <policy group="dmail">
    <allow send_destination="org.dmail"/>
  </policy>
</busconfig>

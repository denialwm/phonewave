[package]
name = "dmail"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Modem service for Qualcomm phones: QMI over QRTR"
license = "MIT"

[dependencies]
async-channel = "2.5"
async-executor = "1"
async-io = "2.6"
async-signal = "0.2"
blocking = "1"
futures-lite = "2.6"
libc = "0.2"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
zbus = "5.18"

[profile.release]
lto = "thin"
strip = true

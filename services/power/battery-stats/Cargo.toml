[package]
name = "battery-stats"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Where a phone's battery goes: energy and hardware use per screen state, per hour"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true

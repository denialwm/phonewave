<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.hapticd"/>
  </policy>
  <policy context="default">
    <!-- hapticd checks caller credentials before any hardware operation. -->
    <allow send_destination="org.hapticd"/>
  </policy>
</busconfig>

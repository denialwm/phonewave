[package]
name = "hapticd"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A small Linux haptics service over D-Bus"
license = "MIT"

[dependencies]
async-channel = "2.5"
async-io = "2.6"
async-signal = "0.2"
futures-lite = "2.6"
libc = "0.2"
nix = { version = "0.31", features = ["ioctl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
udev = "0.9"
zbus = "5.18"

[profile.release]
lto = "thin"
strip = true

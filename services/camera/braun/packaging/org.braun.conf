<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="braun">
    <allow own="org.braun"/>
  </policy>
  <policy context="default">
    <!-- braun lets in whoever may open the camera nodes: root, the video
         group and the active local session. -->
    <allow send_destination="org.braun"/>
  </policy>
</busconfig>

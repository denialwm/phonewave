# fprintd's uff driver starts the phonewave-fingerprint helper, which runs
# the sensor's worker and asks Denial, as the phone's user, to light the
# sensor. The running kernel's boot image tail says which sensor the phone
# has; on a phone whose tail names none, the driver finds no device.
[Unit]
Wants=phonewave-fingerprint-calibration.service
After=phonewave-fingerprint-calibration.service

[Service]
StateDirectory=phonewave-fingerprint
# A warm worker waits there for the next attempt.
ReadWritePaths=-/run/phonewave-fingerprint
ProtectHome=tmpfs
BindReadOnlyPaths=/run/user
# ProtectKernelModules hides /usr/lib/modules, where the tail holds the
# sensor's description and signed app.
BindReadOnlyPaths=-/usr/lib/modules/%v:/run/phonewave-fingerprint/tail
# Qualcomm's TEE, the sensors' control drivers and lighting, the shared
# buffers the overlay uses and the touchscreen.
DeviceAllow=/dev/tee0 rw
DeviceAllow=/dev/fingerprint_dev rw
DeviceAllow=/dev/goodix_fp rw
DeviceAllow=/dev/jiiov_fp rw
DeviceAllow=/dev/fp_illumination rw
DeviceAllow=/dev/dma_heap/system rw
DeviceAllow=char-input r
# The driver gives the helper a utilization floor; RestrictRealtime filters
# sched_setattr whole, the clamp with it.
RestrictRealtime=no

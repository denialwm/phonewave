# fprintd starts the UFF helper, which runs the sensor's worker and asks
# Denial, as the phone's user, to light the sensor.
[Unit]
Wants=uff-calibration.service
After=uff-calibration.service

[Service]
ReadWritePaths=/var/lib/aston-fingerprint
ProtectHome=tmpfs
BindReadOnlyPaths=/run/user
# ProtectKernelModules hides /usr/lib/modules, where the boot image's tail
# holds the sensor's signed app: the helper finds it here.
BindReadOnlyPaths=/usr/lib/modules/%v/firmware/uff:/run/uff-firmware
DeviceAllow=/dev/tee0 rw
DeviceAllow=/dev/fingerprint_dev rw
DeviceAllow=/dev/aston_fp_illumination rw
DeviceAllow=/dev/dma_heap/system rw
DeviceAllow=char-input r

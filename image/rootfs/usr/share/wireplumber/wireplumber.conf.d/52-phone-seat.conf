# Run the Bluetooth and camera monitors for the whole time the user's
# WirePlumber runs, not only while logind calls the seat active.
#
# The phone has one user on one seat. At boot the display manager may start
# the desktop session more than once before it stays up (each failed try
# adds and removes a logind session), and every time the seat turns active
# again WirePlumber's seat monitoring creates another Bluetooth monitor in
# the same process. The second one cannot register its profiles, telephony
# service or MIDI application (the first still holds them), yet takes over,
# and the A2DP transport then belongs to neither: no Bluetooth sink until
# WirePlumber restarts.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
    monitor.camera.seat-monitoring = disabled
  }
}

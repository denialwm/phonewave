# The phone's own sound card: its codec controls are not a volume, so
# PipeWire's volume is software, under one name on every phone.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        device.description = "Built-in Audio"
      }
    }
  }
]

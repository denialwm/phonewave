# The phone's own sound card: its codec controls are not a volume, so
# PipeWire's volume is software, under one name on every phone. The
# OnePlus Pad 3's card goes by its model name.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
      { device.name = "alsa_card.OnePlus-Pad3" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        device.description = "Built-in Audio"
      }
    }
  }
]

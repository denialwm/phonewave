# Always-on display: the running kernel's boot image tail says which output's
# panel holds a picture while off and how, on a phone whose panel can. Denial
# reads only a root-owned regular file, so each boot removes the copy and
# copies it again: C never replaces a file, and tmpfiles removes before it
# creates. Without the tail's file nothing is copied and the phone has none.
r /etc/denial/ambient-display.json
C /etc/denial/ambient-display.json - - - - /usr/lib/modules/%v/denial/ambient-display.json
# The panel driver's switch, which Denial sets while the lock screen shows
# the always-on picture: here for a driver built into the kernel, by
# 70-phone-session.rules for one loaded later.
z /sys/module/*/parameters/ambient 0664 root video -

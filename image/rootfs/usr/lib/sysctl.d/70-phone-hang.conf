# A hung phone reboots after 10 s instead of spinning until the battery is
# gone; pstore keeps the kernel log from just before the hang.
kernel.softlockup_panic = 1
-kernel.hardlockup_panic = 1
kernel.panic = 10
# A panic shows every CPU's stack and the tasks stuck in the kernel: one CPU's
# stack does not tell which part of the phone stopped.
kernel.panic_sys_info = all_bt,blocked_tasks

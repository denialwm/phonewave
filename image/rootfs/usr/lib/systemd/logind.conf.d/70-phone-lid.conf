[Login]
# A tablet's case lid (SW_LID) locks the session: logind sends the session
# Lock and Denial shows its lock screen; the display then goes off on
# Denial's idle timeout (a short press of the power key also blanks it).
# Never suspend: the phones do not sleep yet (70-phone-no-sleep.conf), and
# logind's default of suspending would only log that it cannot. Docked (an
# external display) keeps logind's default, ignore. A desktop that offers
# its own lid setting takes logind's "handle-lid-switch" inhibitor lock and
# acts on the LidClosed property itself.
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock

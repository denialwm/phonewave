# Names resolve through systemd-resolved: NetworkManager hands it each Wi-Fi
# connection's servers and dmail the carrier's. Over the USB cable alone no
# connection names one, so the fallback servers answer.
[Resolve]
FallbackDNS=9.9.9.9#dns.quad9.net 2620:fe::9#dns.quad9.net 1.1.1.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com
# Unicast DNS only: the phone answers no name queries on the networks it joins.
LLMNR=no
MulticastDNS=no

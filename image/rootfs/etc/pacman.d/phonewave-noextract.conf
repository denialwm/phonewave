# Files pacman never unpacks on a phone, at the image build and on every
# update. pacman.conf includes this file from its [options]
# (usr/lib/phonewave-system/pacman-noextract puts the line there).
#
# Welcome is the desktop's first-start tour: its launcher entry stays off the
# phone, and /etc/skel/.config/denial/welcome keeps it from starting.
NoExtract = usr/share/applications/org.denialwm.Welcome.desktop

# Denial's package repositories, which /etc/pacman.conf includes before Arch
# Linux ARM's (usr/lib/phonewave-system/pacman-repos puts the line there).
# Listed first, a package of ours that replaces an Arch one, such as
# ffmpeg-denial for ffmpeg, takes its place on pacman -Syu.

[denial]
SigLevel = Required TrustedOnly
Server = https://packages.denialwm.org/arch/$arch

[denial-phone]
SigLevel = Required TrustedOnly
Server = https://packages.denialwm.org/phone/$arch

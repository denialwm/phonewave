# The Ace 3's ADSP, CDSP, modem, IPA, video and their device trees, from the
# booted slot's modem partition; image/stock-firmware. OnePlus names its
# releases differently; this is the Qualcomm build the files carry.
release=Kailua.LA.1.0.r1-02022-STD.PROD-1
partition=modem
fstype=vfat
options=
folder=image
target=qcom/sm8550/oneplus/aston
required="adsp.mdt adsp_dtb.mdt"

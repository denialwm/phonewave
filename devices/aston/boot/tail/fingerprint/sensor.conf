# The 12R's fingerprint sensor, for the phonewave-fingerprint package:
# fprintd's uff driver and the helper it starts read it. Paths are inside
# this tail.
[Sensor]
# The device ID fprintd stores with each print, and its name for the sensor.
Id=aston-goodix-g7s-uff
Name=UFF G7s UFF (native, experimental)
Templates=5
Worker=uff
Firmware=firmware/uff/uff_gx.elf
# Optical: Denial lights the sensor while a finger is down.
Contact=presentation
Presentation=goodix-g7s-uff
Illumination=/dev/fp_illumination

[Calibration]
Partition=persist
Files=fingerprint/fingerprint_cali.bin;fingerprint/fp_cali_serial_number.txt

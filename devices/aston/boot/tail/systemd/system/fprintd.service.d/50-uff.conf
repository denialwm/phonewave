# The UFF sensor under the screen: fprintd's uff driver starts the
# fingerprint-uff helper, which runs the sensor's worker and asks Denial, as
# the phone's user, to light the sensor.
[Unit]
Wants=uff-calibration.service
After=uff-calibration.service

[Service]
StateDirectory=uff-fingerprint
ProtectHome=tmpfs
BindReadOnlyPaths=/run/user
# ProtectKernelModules hides /usr/lib/modules, where this tail holds the
# sensor's signed app: the helper finds it here.
BindReadOnlyPaths=/usr/lib/modules/%v/firmware/uff:/run/uff-firmware
DeviceAllow=/dev/tee0 rw
DeviceAllow=/dev/fingerprint_dev rw
DeviceAllow=/dev/aston_fp_illumination rw
DeviceAllow=/dev/dma_heap/system rw
DeviceAllow=char-input r

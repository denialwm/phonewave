pcm_type.agm {
    lib "/opt/nyx-audioreach/prefix/lib/alsa-lib/libasound_module_pcm_agm.so"
}

ctl_type.agm {
    lib "/opt/nyx-audioreach/prefix/lib/alsa-lib/libasound_module_ctl_agm.so"
}

pcm.nyx_agm_raw {
    type agm
    card 100
    device 100
}

ctl.nyx_agm {
    type agm
    card 100
}

pcm.nyx_speaker {
    type plug
    slave.pcm "nyx_agm_raw"
    slave.rate 48000
    slave.channels 2
    slave.format S24_LE
}

pcm.!default {
    type pipewire
    playback_node "-1"
    capture_node "-1"
    hint {
        show on
        description "Default ALSA Output (PipeWire)"
    }
}

ctl.!default {
    type pipewire
}

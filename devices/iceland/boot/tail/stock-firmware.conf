# The Pad 4's ADSP and its device tree, from the booted slot's modem
# partition; image/stock-firmware. OnePlus names its releases differently;
# this is the Qualcomm build the files carry. The tablet comes up without
# them, only without sound.
release=Kaanapali.LA.1.0.r1-00975-STD.PROD-1
partition=modem
fstype=vfat
options=
folder=image
target=qcom/kaanapali/oneplus/iceland
required=

# The OnePlus Pad 3's voice call profile, qcom/sm8750/OnePlus-Pad3-voice.bin:
# what services/audio/voicegen asks of the stock ACDB, and the host-side
# settings it adds. The kernel's q6apm voice session runs the result.
# stock-tuning/README.md documents the capture.

# In the vault: the stock vendor partition's board calibration (sun_mtp)
acdb = "erhai/reference/stock-audio/vendor/etc/acdbdata/sun_mtp/MTP_acdb_cal.acdb"
firmware = "qcom/sm8750/OnePlus-Pad3-voice.bin"
vsid = 0x11C05000  # VOICEMMODE1

[rx]
port = "SECONDARY_MI2S_RX"
keys = [
  [0xA1000000, 0xA1000010],  # STREAMRX: VOICE_CALL_RX
  [0xA2000000, 0xA2000001],  # DEVICERX: SPEAKER
  [0xAC000000, 0xAC000005],  # DEVICEPP_RX: VOICE_DEFAULT
  [0xAF000000, 0xAF000001],  # STREAMPP_RX: DEFAULT
  [0xB3000000, 0xB3000001],  # VSID: DEFAULT
]
# The board ACDB's call graph is all static modules; the Awinic speaker
# protection is a pair of dynamic modules only in the OEM's ODM-partition
# ACDB variant (stock-tuning/odm/etc/acdbdata/), which the stock HAL loads
# instead. Nothing to drop, unlike the RedMagic 11 Pro.
# Media format converters set to what the endpoint plays.
converters = [0x448d, 0x41cb]
# TDM1 (MI2S-Secondary, lpi_i2s3), the AW882xx amplifiers: 48 kHz, 32 bit,
# 8 slots, the framing the stock TDM-LPAIF-RX-SECONDARY backend runs
# (stock-tuning/odm/etc/backend_conf.xml). The stock AFE port is the LPASS
# RX port SECONDARY_MI2S_RX, as in Aston's identical speaker architecture —
# the re-landing doc's SECONDARY_MI2S_TX guess was the TX direction. The
# slot-to-amplifier map is the first-boot measurement.
# LPAIF, secondary interface, data line SD2, word select from the DSP.
endpoint = 0x43b1
format = [48000, 32, 8]
i2s = [0, 1, 2, 1]

[tx]
port = "TX_CODEC_DMA_TX_3"
keys = [
  [0xB1000000, 0xB1000007],  # STREAMTX: VOICE_CALL_TX
  [0xA3000000, 0xA3000001],  # DEVICETX: SPEAKER_MIC, as stock pairs with the speakers
  [0xAD000000, 0xAD00000F],  # DEVICEPP_TX: the mic processing that opens on this ACDB
  [0xB3000000, 0xB3000001],  # VSID: DEFAULT
]
# The echo canceller (0x070010a3) is a dynamic module the stock ADSP loads
# from the vendor partition, as on the RedMagic 11 Pro, whose DSP refused
# it; the modem-partition ADSP serves no such files. The microphone goes
# straight to its main output. If the first-boot call opens with it, drop
# the pair and keep the processing.
drop = [0x468a]
join = [0x469c, 1, 0x48a3, 2]
# TX_CODEC_DMA_TX_3, the WCD939x microphones: LPAIF_RXTX, TX3. Rate and
# width as the backend link; channels as the ACDB gives the endpoint.
endpoint = 0x43ad
format = [48000, 16]
codec_dma = [1, 4]

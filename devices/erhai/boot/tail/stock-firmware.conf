# The Pad 3's ADSP and CDSP (and their device trees), from the booted slot's
# modem partition; image/stock-firmware. Oneplus names its releases
# differently; this is the Qualcomm build the files carry. The tablet comes
# up without them, only without sound.
release=Pakala.LA.1.0.r1-01218-STD.PROD-1
partition=modem
fstype=vfat
options=
folder=image
target=qcom/sm8750
required="adsp.mdt adsp_dtb.mdt cdsp.mdt cdsp_dtb.mdt"

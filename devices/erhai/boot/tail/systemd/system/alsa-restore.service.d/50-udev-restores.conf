# udev restores the card's saved controls as it adds the card
# (90-alsa-restore.rules: alsactl --export restore), before WirePlumber
# learns of it. This unit's second restore runs once the card reaches
# sound.target, while WirePlumber's UCM probe is setting the HiFi verb:
# it wrote back routing that a different UCM had saved (MultiMedia3
# off), the headphone PCM had no back end, and PipeWire dropped every
# HiFi profile, leaving no speaker sink. Keep only the store at shutdown.
[Service]
ExecStart=

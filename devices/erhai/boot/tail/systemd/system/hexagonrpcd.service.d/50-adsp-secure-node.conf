# fastrpc creates /dev/fastrpc-adsp-secure when the ADSP's glink edge comes
# up, about 10 ms after hexagonrpcd-stock-sensors is done: hexagonrpcd then
# started without the node in its device allow list, failed with EPERM and
# came back only through Restart=. Start it once the node exists
# (70-hexagonrpcd.rules makes the node a systemd device).
[Unit]
Wants=dev-fastrpc\x2dadsp\x2dsecure.device
After=dev-fastrpc\x2dadsp\x2dsecure.device

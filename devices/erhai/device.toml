# OnePlus Pad 3 (OPD2415), SoC SM8750 ("sun").
codename = "erhai"
model = "OnePlus Pad 3"
chassis = "tablet"
soc = "sm8750"
dtb = "qcom/sm8750-oneplus-erhai.dtb"

[display]
panel = "oneplus,erhai-xn242"
# Bonded dual-DSI DSC mode of the XN242 panel pair; per-DSI each XN242 runs
# 1696x2400.
resolution = [3392, 2400]
# Vendor's dfps list is 120/144/90/60/50/48/30; conservative until the mode
# table is verified on hardware.
refresh_hz = [60, 120]

[touch]
# NT36536 on SPI4 (QUPv3 SE4); the in-tree Novatek driver, the same one the
# Pad 4 (iceland) runs.
controller = "novatek,NVT-ts-spi"

[haptics]
# PMIH0108 HAP530 LRA, in-tree qcom-spmi-haptics driver plus hapticd.
actuator = "PMIH0108 HAP530 LRA"
input_name = "qcom-spmi-haptics"

# No [rtc] section yet: whether the PMIC RTC (pmk8550) is settable is
# unverified. If it is not, the same rtc-offset pattern as iceland applies.

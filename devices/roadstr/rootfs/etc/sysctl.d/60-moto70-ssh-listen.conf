# sshd listens only on the USB (10.77.71.2) and Wi-Fi addresses, and binds
# them when it starts. Either can come later: the cable is plugged in after
# boot, Wi-Fi connects late. Allow the bind before the address exists, so
# sshd always serves both instead of failing or serving one of them.
net.ipv4.ip_nonlocal_bind = 1

# Real-time priority does not imply a permanent maximum-frequency request.
# Tasks may still request an explicit capacity floor; CPU maximums are unchanged.
kernel.sched_util_clamp_min_rt_default = 0

# WALT starts with FULL_THROTTLE_BOOST, even when using schedutil.
# Match Motorola's post-boot release of task-placement/core-control boost.
# The vendor module is loaded by the initramfs before systemd-sysctl.
walt.sched_boost = 0

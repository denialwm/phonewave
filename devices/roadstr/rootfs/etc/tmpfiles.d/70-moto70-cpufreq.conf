# Override the inherited performance boot default after CPU policies exist.
# Keep the full frequency range; schedutil raises clocks in response to work.
w /sys/devices/system/cpu/cpufreq/policy0/scaling_governor - - - - schedutil
w /sys/devices/system/cpu/cpufreq/policy3/scaling_governor - - - - schedutil
w /sys/devices/system/cpu/cpufreq/policy7/scaling_governor - - - - schedutil

# The mainline kernel has no sound card for the Edge 70 yet. One silent sink
# gives the volume keys and controls something to adjust; any real sink has
# a higher priority and becomes the default instead.
context.objects = [
    { factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "moto70-dummy-output"
            node.description        = "Dummy output (no sound card yet)"
            media.class             = Audio/Sink
            audio.position          = [ FL FR ]
            monitor.channel-volumes = true
            object.linger           = true
            priority.session        = 1
            priority.driver         = 1
        }
    }
]

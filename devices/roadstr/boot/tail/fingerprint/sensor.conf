# The Edge 70's fingerprint sensor, for the fingerprint-phonewave package:
# fprintd's uff driver and the helper it starts read it. Paths are inside
# this tail.
[Sensor]
# The device ID fprintd stores with each print, and its name for the sensor.
Id=roadstr-jiiov-jv0307
Name=JIIOV JV0307 optical (native, experimental)
Templates=5
Worker=jiiov
# ancapp64 from the stock modem partition's image/, joined by build-boot.sh.
Firmware=firmware/jiiov/ancapp64.elf
Contact=touch

[Calibration]
Partition=persist
Files=jiiov/jv_opt_data.bin;jiiov/jv_normalized_calibration.bin;jiiov/jv_normalized_calibration.bin.bak

# The Phone (2)'s sensors run on the SLPI, whose non-secure FastRPC node is
# fastrpc-sdsp; the stock unit serves the ADSP's.
[Unit]
# The unit exits until the SLPI is up, and Restart=always starts it again every
# second: no start limit, or systemd gives up on it within the first seconds.
StartLimitIntervalSec=0

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-sdsp -d sdsp -s -R /run/hexagonrpcd
DeviceAllow=/dev/fastrpc-sdsp rw
BindPaths=-/dev/fastrpc-sdsp

# dmail needs a [data] section to start. These values are the 12R's (the
# OnePlus 12R's IPA endpoints) and untested here: the IPA is not described yet.
[data]
ipa_netdev = "rmnet_ipa0"
dpm = { ep_type = "embedded", iface = 1, rx = 2, tx = 24 }
qmap = "v5"
dl_datagrams = 16
dl_datagram_size = 8192
mtu_max = 1492

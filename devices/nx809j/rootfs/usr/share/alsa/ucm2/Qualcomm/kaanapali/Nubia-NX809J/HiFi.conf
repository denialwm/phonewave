SectionVerb {
    EnableSequence [
        cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
    ]
    DisableSequence [
        cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Speakers"
    EnableSequence [
        # The ADSP's stream gain stays at unity; PipeWire sets the volume
        # in software.
        cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
        # The AW88461s run 6 dB (one step of 64) under the stock tuning's
        # level: the stock speaker protection runs in Android's audio DSP
        # and has no counterpart here.
        cset "name='Left Playback Volume' 959"
        cset "name='Right Playback Volume' 959"
    ]
    DisableSequence [
        cset "name='Left Playback Volume' 0"
        cset "name='Right Playback Volume' 0"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
    }
}

SectionDevice."Mic1" {
    Comment "Main microphone (AMIC1)"
    ConflictingDevice [
        "Mic2"
        "Mic3"
    ]
    # Stock's handset and speakerphone mic. The capture PCM is stereo only:
    # both decimators take this one mic. ADC1/2 and ADC3/4 share a
    # SoundWire port: one ADC at a time; the gains are stock's.
    EnableSequence [
        cset "name='ADC2 Switch' 0"
        cset "name='ADC2_MIXER Switch' 0"
        cset "name='ADC3 Switch' 0"
        cset "name='ADC3_MIXER Switch' 0"
        cset "name='ADC4 Switch' 0"
        cset "name='ADC4_MIXER Switch' 0"
        cset "name='ADC1_MIXER Switch' 1"
        cset "name='ADC1 Switch' 1"
        cset "name='TX0 MODE' ADC_NORMAL"
        cset "name='ADC1 Volume' 12"
        cset "name='TX DEC0 MUX' SWR_MIC"
        cset "name='TX DEC1 MUX' SWR_MIC"
        cset "name='TX SMIC MUX0' SWR_MIC0"
        cset "name='TX SMIC MUX1' SWR_MIC0"
        cset "name='TX_DEC0 Volume' 84"
        cset "name='TX_DEC1 Volume' 84"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
        cset "name='TX_AIF1_CAP Mixer DEC1' 1"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX_AIF1_CAP Mixer DEC1' 0"
        cset "name='TX SMIC MUX0' ZERO"
        cset "name='TX SMIC MUX1' ZERO"
        cset "name='ADC1 Switch' 0"
        cset "name='ADC1_MIXER Switch' 0"
    ]
    Value {
        CapturePriority 200
        CapturePCM "hw:${CardId},2"
        CaptureChannels 2
    }
}

SectionDevice."Mic2" {
    Comment "Second microphone (AMIC4)"
    ConflictingDevice [
        "Mic1"
        "Mic3"
    ]
    # Stock's game mic.
    EnableSequence [
        cset "name='ADC1 Switch' 0"
        cset "name='ADC1_MIXER Switch' 0"
        cset "name='ADC2 Switch' 0"
        cset "name='ADC2_MIXER Switch' 0"
        cset "name='ADC4 Switch' 0"
        cset "name='ADC4_MIXER Switch' 0"
        cset "name='ADC3 MUX' CH3_AMIC4"
        cset "name='ADC3_MIXER Switch' 1"
        cset "name='ADC3 Switch' 1"
        cset "name='TX2 MODE' ADC_NORMAL"
        cset "name='ADC3 Volume' 12"
        cset "name='TX DEC0 MUX' SWR_MIC"
        cset "name='TX DEC1 MUX' SWR_MIC"
        cset "name='TX SMIC MUX0' SWR_MIC2"
        cset "name='TX SMIC MUX1' SWR_MIC2"
        cset "name='TX_DEC0 Volume' 84"
        cset "name='TX_DEC1 Volume' 84"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
        cset "name='TX_AIF1_CAP Mixer DEC1' 1"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX_AIF1_CAP Mixer DEC1' 0"
        cset "name='TX SMIC MUX0' ZERO"
        cset "name='TX SMIC MUX1' ZERO"
        cset "name='ADC3 Switch' 0"
        cset "name='ADC3_MIXER Switch' 0"
    ]
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},2"
        CaptureChannels 2
    }
}

SectionDevice."Mic3" {
    Comment "Third microphone (AMIC3)"
    ConflictingDevice [
        "Mic1"
        "Mic2"
    ]
    # Hears the speakers loudest of the three.
    EnableSequence [
        cset "name='ADC1 Switch' 0"
        cset "name='ADC1_MIXER Switch' 0"
        cset "name='ADC2 Switch' 0"
        cset "name='ADC2_MIXER Switch' 0"
        cset "name='ADC4 Switch' 0"
        cset "name='ADC4_MIXER Switch' 0"
        cset "name='ADC3 MUX' CH3_AMIC3"
        cset "name='ADC3_MIXER Switch' 1"
        cset "name='ADC3 Switch' 1"
        cset "name='TX2 MODE' ADC_NORMAL"
        cset "name='ADC3 Volume' 12"
        cset "name='TX DEC0 MUX' SWR_MIC"
        cset "name='TX DEC1 MUX' SWR_MIC"
        cset "name='TX SMIC MUX0' SWR_MIC2"
        cset "name='TX SMIC MUX1' SWR_MIC2"
        cset "name='TX_DEC0 Volume' 84"
        cset "name='TX_DEC1 Volume' 84"
        cset "name='TX_AIF1_CAP Mixer DEC0' 1"
        cset "name='TX_AIF1_CAP Mixer DEC1' 1"
    ]
    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC0' 0"
        cset "name='TX_AIF1_CAP Mixer DEC1' 0"
        cset "name='TX SMIC MUX0' ZERO"
        cset "name='TX SMIC MUX1' ZERO"
        cset "name='ADC3 Switch' 0"
        cset "name='ADC3_MIXER Switch' 0"
    ]
    Value {
        CapturePriority 50
        CapturePCM "hw:${CardId},2"
        CaptureChannels 2
    }
}

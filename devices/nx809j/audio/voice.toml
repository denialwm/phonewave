# The RedMagic 11 Pro's voice call profile, qcom/kaanapali/Nubia-NX809J-voice.bin:
# what services/audio/voicegen asks of the stock ACDB, and the host-side
# settings it adds. The kernel's q6apm voice session runs the result.

# In the vault: the stock vendor_b partition's calibration (canoe_mtp_wsa884x)
acdb = "nx809j/reference/stock-audio-b/vendor/etc/acdbdata/canoe_mtp_wsa884x/MTP_canoe_wsa884x_acdb_cal.acdb"
firmware = "qcom/kaanapali/Nubia-NX809J-voice.bin"
vsid = 0x11C05000  # VOICEMMODE1

[rx]
port = "PRIMARY_MI2S_RX"
keys = [
  [0xA1000000, 0xA1000010],  # STREAMRX: VOICE_CALL_RX
  [0xA2000000, 0xA2000004],  # DEVICERX: HANDSET, the earpiece
  [0xAC000000, 0xAC000005],  # DEVICEPP_RX: VOICE_DEFAULT
  [0xAF000000, 0xAF000001],  # STREAMPP_RX: DEFAULT
  [0xB3000000, 0xB3000001],  # VSID: DEFAULT
]
# The earpiece is the left AW88461 (0x35) on its receiver tuning; UCM sets
# the amplifiers. Stock's handset graph has no speaker protection modules.
# Media format converters set to what the endpoint plays: stock plays the
# handset in mono, here the call is copied to both slots of the link the
# amplifiers share, as for media.
converters = [0x465b, 0x41dd]
# Primary MI2S: 48 kHz, 32 bit, the width the call calibration gives 0x4ad1,
# the last converter before it. LPAIF, primary interface, data line SD1,
# word select from the DSP.
endpoint = 0x4615
format = [48000, 32, 2]
i2s = [0, 0, 2, 1]

[tx]
port = "TX_CODEC_DMA_TX_3"
keys = [
  [0xB1000000, 0xB1000007],  # STREAMTX: VOICE_CALL_TX
  [0xA3000000, 0xA3000004],  # DEVICETX: HANDSETMIC, as stock pairs with the earpiece
  [0xAD000000, 0xAD00000F],  # DEVICEPP_TX: VOICE_FLUENCE_SMECNS, stock's single mic choice
  [0xB3000000, 0xB3000001],  # VSID: DEFAULT
]
# The audio-domain listener loads capi_fluence_nn (0x070010a3) from the
# stock DSP partition. Keep both ACDB inputs: microphone and echo reference.
# TX_CODEC_DMA_TX_3, the WCD939x microphones (AMIC1, stock's handset and speaker mic):
# LPAIF_RXTX, TX3. Rate and width as the backend link; channels as the ACDB
# gives the endpoint.
endpoint = 0x43af
format = [48000, 16]
codec_dma = [1, 4]

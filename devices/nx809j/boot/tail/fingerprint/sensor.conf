# The RedMagic's fingerprint sensor, for the fingerprint-phonewave package:
# fprintd's uff driver and the helper it starts read it. Paths are inside
# this tail.
[Sensor]
# The device ID fprintd stores with each print, and its name for the sensor.
Id=nx809j-goodix-gum5228
Name=Goodix GUM5228 ultrasonic (native, experimental)
Templates=10
Worker=goodix
# goodixfp64 from the stock vendor_firmware_mnt, assembled into one file by
# services/fingerprint/goodix/build.py --assemble-only.
Firmware=firmware/goodix/goodixfp64.elf
# Ultrasonic: no light, only the touchscreen's report of a finger on the mark.
Contact=touch
# The worker stays up after a rejected finger for the next attempt.
Warm=true

[Calibration]
Partition=persist
Files=goodix/
